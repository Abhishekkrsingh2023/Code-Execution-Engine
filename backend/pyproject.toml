[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishekkrsingh2023", email = "abhishekkrsingh2023kolkata@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.2",
    "redis[hiredis]>=8.0.1",
    "pydantic-settings>=2.8.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "loguru>=0.7.3",
    "orjson>=3.13.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
    "asyncer>=0.0.18",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B008",
    "E501",
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
]
