[project]
name = "code-executor"
version = "0.1.0"
description = "A scalable, asynchronous remote code execution engine built with FastAPI, Redis, and Docker."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.2",
    "redis[hiredis]>=8.0.1",
    "pydantic-settings>=2.8.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.51",
]
