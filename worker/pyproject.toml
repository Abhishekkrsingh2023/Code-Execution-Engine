[project]
name = "code-executor-worker"
version = "0.1.0"
description = "Asynchronous code execution worker for Code0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "redis[hiredis]>=8.0.1",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.8.0",
    "loguru>=0.7.3",
    "orjson>=3.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "E501",
    "UP042",
]
